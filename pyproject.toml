[project]
authors = [{ name = "pablo vela", email = "pablovela5620@gmail.com" }]
name = "egoexo-forge"
requires-python = ">= 3.11"
version = "0.1.0"
dependencies = [
    "gradio>=6.0",
    "gradio-rerun>=0.28.2,<0.29",
    "rerun-sdk>=0.28.1,<0.29",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
egoexo_forge = { path = ".", editable = true }
simplecv = { git = "https://github.com/pablovela5620/simplecv.git", rev = "31cc852429cc292959f30c0277010ec57caa6caf" }
rtmlib = { git = "https://github.com/pablovela5620/rtmlib.git", rev = "98bca2193c39b349034b280803b54c9ee58f7c68" }
wilor-nano = { git = "https://github.com/pablovela5620/wilor-nano.git", rev = "b2d019fd7dcd4ac61b15da3de4200df9c29ba411" }
timm = "<1.0"  # Pin for wilor-nano compatibility (RotaryEmbedding import moved in 1.0)


[tool.pixi.tasks]
app = { cmd = "python tools/app.py", description = "Run egoexo viewer Gradio app" }

[tool.pixi.dependencies]
python = "==3.12"
jaxtyping = ">=0.2.33,<0.3"
beartype = ">=0.19.0,<0.20"
numpy = ">=2.0"
einops = ">=0.8.0,<0.9"
icecream = ">=2.1.3,<3"
py-opencv = ">=4.10.0,<5"
tyro = ">=0.9.1,<0.10"
tqdm = ">=4.67.1,<5"
huggingface_hub = "*"
open3d = ">=0.18.0,<0.19"
scipy = ">=1.15.2,<2"
pyserde = ">=0.24.0,<0.25"
h5py = ">=3.13.0,<4"
natsort = ">=8.4.0,<9"
pytorch = ">=2.7,<2.8"
torchvision = ">=0.22,<0.23"
pillow = ">=8.0,<12"
av = "*"

[tool.pixi.target.linux-64.dependencies]
datasets = ">=4.0.0"

# cuda129 feature - GPU dependencies
[tool.pixi.feature.cuda129]
platforms = ["linux-64"]
channels = ["https://prefix.dev/conda-forge"]

[tool.pixi.feature.cuda129.system-requirements]
cuda = "12.9"

[tool.pixi.feature.cuda129.dependencies]
# CUDA Build Tools
cuda-compiler = "*"
cuda-version = "12.9.*"
cuda-cudart-dev = "*"
cuda-crt = "*"
libcusparse-dev = "*"
cuda-driver-dev = "*"
cuda-nvcc = "*"
cuda-nvrtc-dev = "*"
cuda-nvtx = "*"
cuda-nvtx-dev = "*"
cuda-nvml-dev = "*"
cuda-profiler-api = "*"

# CUDA Libraries
cudnn = "*"
libcublas-dev = "*"
libcudss-dev = "*"
libcufile-dev = "*"
libcufft-dev = "*"
libcurand-dev = "*"
libcusolver-dev = "*"
cusparselt = "*"
libnvjitlink = "*"
pytorch-gpu = ">=2.7,<2.8"
torchvision = ">=0.22,<0.23"

[tool.pixi.feature.cuda129.pypi-dependencies]
onnxruntime-gpu = ">=1.22.0,<2" # GPU version overrides CPU-only onnxruntime

[tool.pixi.environments]
gpu = { features = ["cuda129"], solve-group = "cuda129" }

[tool.ruff]
line-length = 150
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

ignore = [
    "E501", # Line too long.
    "F722", # Forward annotation false positive from jaxtyping. Should be caught by pyright.
    "F821", # Forward annotation false positive from jaxtyping. Should be caught by pyright.
]
